<section class="page-stage">
  <div class="arin-wrap page-stage-copy">
    <p class="film-kicker">{{ 'PRIVATE.EYEBROW' | translate }}</p>
    <h1 class="film-display max-w-3xl">{{ 'PRIVATE.TITLE' | translate }}</h1>
  </div>
</section>

<section class="page-panel bg-cream">
  <div class="arin-wrap grid items-center gap-16 lg:grid-cols-2">
    <div data-aos="fade-up">
      <p class="max-w-xl text-base leading-8 text-olive">{{ 'PRIVATE.LEAD' | translate }}</p>
      <a routerLink="/quote" [queryParams]="{ service: 'agencies' }" class="btn btn-gold mt-10">
        {{ 'PRIVATE.START' | translate }}
      </a>
    </div>
    <div class="page-still min-h-[380px]" data-aos="fade-up">
      <img [src]="images.cosmetics" alt="" class="h-full w-full object-cover" />
    </div>
  </div>
</section>

<section class="page-panel bg-sand">
  <div class="arin-wrap grid gap-10 md:grid-cols-2 lg:grid-cols-4">
    <article *ngFor="let step of steps" class="page-fact" data-aos="fade-up">
      <span class="film-kicker">{{ step.index }} / 04</span>
      <h3 class="mt-5 font-display text-xl font-bold text-forest">{{ txt(step.title) }}</h3>
      <p class="mt-3 text-sm leading-7 text-olive">{{ txt(step.body) }}</p>
    </article>
  </div>
</section>

<section class="page-panel bg-cream">
  <div class="arin-wrap">
    <p class="film-kicker !text-gold">{{ 'PRIVATE.OUT' | translate }}</p>
    <div class="mt-12 grid gap-10 md:grid-cols-2 lg:grid-cols-4">
      <article *ngFor="let d of deliverables" class="page-fact">
        <h3 class="font-display text-lg font-bold text-forest">{{ txt(d.title) }}</h3>
        <p class="mt-3 text-sm leading-7 text-olive">{{ txt(d.body) }}</p>
      </article>
    </div>
  </div>
</section>
