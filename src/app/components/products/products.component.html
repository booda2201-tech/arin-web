<section class="page-stage">
  <div class="arin-wrap page-stage-copy">
    <p class="film-kicker">{{ 'PRODUCTS_PAGE.EYEBROW' | translate }}</p>
    <h1 class="film-display max-w-4xl">{{ 'PRODUCTS_PAGE.TITLE' | translate }}</h1>
    <p class="mt-6 max-w-2xl text-base leading-8 text-platinum">{{ 'PRODUCTS_PAGE.LEAD' | translate }}</p>
  </div>
</section>

<section class="page-panel bg-cream">
  <div class="arin-wrap">
    <div class="mb-12 flex flex-wrap gap-x-6 gap-y-3">
      <button
        *ngFor="let cat of categories"
        type="button"
        class="film-kicker !mb-0 border-0 bg-transparent p-0 transition"
        [class.!text-forest]="active === cat.id"
        [class.!text-gold]="active !== cat.id"
        (click)="setFilter(cat.id)"
      >
        {{ txt(cat.name) }}
      </button>
    </div>

    <div class="grid gap-x-6 gap-y-12 sm:grid-cols-2 lg:grid-cols-3">
      <article *ngFor="let p of filtered">
        <div class="page-still aspect-[1.1] bg-cover bg-center" [style.backgroundImage]="'url(' + p.image + ')'"></div>
        <div class="page-fact mt-5">
          <p class="film-kicker !mb-2">{{ txt(p.origin) }}</p>
          <h3 class="font-display text-lg font-bold text-forest">{{ txt(p.name) }}</h3>
          <p class="mt-2 text-xs text-olive">{{ txt(p.packaging) }}</p>
          <p class="mt-3 text-sm leading-7 text-olive">{{ txt(p.notes) }}</p>
          <a [routerLink]="'/quote'" [queryParams]="{ product: p.slug }" class="mt-4 inline-flex text-sm text-gold">
            {{ 'PRODUCTS_PAGE.QUOTE' | translate }}
            <i class="bi bi-arrow-left ms-1 rtl:rotate-180"></i>
          </a>
        </div>
      </article>
    </div>
  </div>
</section>
