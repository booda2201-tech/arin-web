<section class="page-stage">
  <div class="arin-wrap page-stage-copy">
    <p class="film-kicker">{{ 'PROJECTS_PAGE.EYEBROW' | translate }}</p>
    <h1 class="film-display max-w-4xl">{{ 'PROJECTS_PAGE.TITLE' | translate }}</h1>
    <p class="mt-6 max-w-2xl text-base leading-8 text-platinum">{{ 'PROJECTS_PAGE.LEAD' | translate }}</p>
  </div>
</section>

<section class="page-panel bg-cream">
  <div class="arin-wrap grid gap-x-6 gap-y-12 sm:grid-cols-2 lg:grid-cols-3">
    <article *ngFor="let p of projects" class="group" data-aos="fade-up">
      <div class="page-still aspect-[4/3]">
        <img [src]="p.image" alt="" class="h-full w-full object-cover transition duration-700 group-hover:scale-105" />
      </div>
      <div class="page-fact mt-5">
        <p class="film-kicker !mb-2">{{ txt(p.category) }}</p>
        <p class="text-sm leading-7 text-olive">{{ txt(p.caption) }}</p>
        <span class="mt-3 inline-block text-xs text-gold/80">{{ 'COMMON.SAMPLE' | translate }}</span>
      </div>
    </article>
  </div>
</section>
